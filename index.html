<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Профіль користувача</title>
  <link rel="stylesheet" href="style-scss.css">
  <!-- Для Less-версії замініть на: style-less.css -->
</head>
<body>
  <main class="profile">
    <div class="profile__banner"></div>
    <div class="profile__body">
      <img class="profile__photo" src="avatar.svg" alt="Фото профілю">
      <h1 class="profile__name">Олександр Приймак</h1>
      <p class="profile__role">Веброзробник</p>
      <p class="profile__desc">Створюю адаптивні сайти та вивчаю CSS-препроцесори. Люблю чистий код і яскравий дизайн.</p>

      <div class="profile__tags">
        <span>HTML</span><span>CSS</span><span>Sass</span><span>Less</span>
      </div>

      <ul class="profile__stats">
        <li><strong>128</strong>публікацій</li>
        <li><strong>2,4K</strong>підписників</li>
        <li><strong>312</strong>підписок</li>
      </ul>

      <div class="profile__actions">
        <button class="btn--primary">Підписатися</button>
        <button class="btn--secondary">Повідомлення</button>
      </div>
    </div>
  </main>
</body>
</html>
